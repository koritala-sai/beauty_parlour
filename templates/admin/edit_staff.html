{% extends "base.html" %}
{% block title %}Edit Staff — Admin{% endblock %}

{% block content %}
<p class="eyebrow">Owner Panel</p>
<h1>Edit Staff: {{ staff.name }}</h1>
<div class="divider left"><span class="mark"></span></div>

<div class="admin-nav">
    <a href="{{ url_for('admin.manage_staff') }}" class="btn-outline">← Back to Staff</a>
</div>

<form method="POST" class="form" style="max-width:520px">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="name">Name</label>
    <input type="text" name="name" id="name" value="{{ staff.name }}" required>

    <label for="specialties">Specialties <span class="muted">(optional)</span></label>
    <input type="text" name="specialties" id="specialties" value="{{ staff.specialties or '' }}">

    <button type="submit" class="btn">Save Changes</button>
</form>
{% endblock %}
